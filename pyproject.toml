[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
marketpipe = "marketplace_pipeline.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["storage: opt-in PostgreSQL/MinIO integration in an owned test namespace"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
