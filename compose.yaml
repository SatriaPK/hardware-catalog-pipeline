services:
  postgres:
    image: postgres:16
    container_name: de_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:?required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: de_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?required}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

  pipeline:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - pipeline

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?required}

      # Marketplace APIs
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_US}

      RAKUTEN_APPLICATION_ID: ${RAKUTEN_APPLICATION_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      RAKUTEN_ORIGIN: ${RAKUTEN_ORIGIN:-}
      RAKUTEN_REFERER: ${RAKUTEN_REFERER:-}


    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    volumes:
      - ./data:/app/data

volumes:
  pg_data:
  minio_data:
